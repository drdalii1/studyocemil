<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stüdyo Cemil | Google Yorum</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.card{

width:380px;
background:#1b1b1b;
border-radius:22px;
padding:35px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,.45);

}

.logo{

font-size:42px;
margin-bottom:10px;

}

h1{

color:white;
font-size:32px;
margin-bottom:8px;

}

.subtitle{

color:#cfcfcf;
margin-bottom:20px;
font-size:17px;

}

.stars{

font-size:34px;
color:#FFD700;
margin-bottom:20px;
animation:pulse 1.6s infinite;

}

@keyframes pulse{

0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}

}

.info{

color:#ddd;
line-height:1.7;
font-size:16px;
margin-bottom:30px;

}

button{

width:100%;
padding:18px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:14px;
cursor:pointer;

background:linear-gradient(90deg,#4285F4,#34A853,#FBBC05,#EA4335);

color:white;

transition:.25s;

}

button:hover{

transform:scale(1.03);

}

.small{

margin-top:22px;
font-size:14px;
color:#999;

}

.loading{

margin-top:18px;
color:#ccc;
display:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">📸</div>

<h1>Stüdyo Cemil</h1>

<div class="subtitle">
Google'da bizi değerlendirin
</div>

<div class="stars">
★★★★★
</div>

<div class="info">

Yorumunuz bizim için çok değerli.

<br><br>

📍 Eyüpsultan

<br>

☎ 0542 236 29 61

</div>

<button onclick="startReview()">

Google'da Yorum Yap

</button>

<div class="loading" id="loading">

Google uygulaması açılıyor...

</div>

<div class="small">

Google uygulaması açılamazsa yorum sayfası otomatik açılacaktır.

</div>

</div>

<script>

const reviewUrl="https://search.google.com/local/writereview?placeid=ChIJG_OOIJ6wyhQRw3v4i_2wWaU";

function isiPhone(){

return /iPhone|iPad|iPod/i.test(navigator.userAgent);

}

function isAndroid(){

return /Android/i.test(navigator.userAgent);

}

function startReview(){

document.getElementById("loading").style.display="block";

if(isiPhone()){

try{

window.location="google://search?q=Stüdyo%20Cemil";

}catch(e){}

setTimeout(function(){

window.location.href=reviewUrl;

},900);

return;

}

if(isAndroid()){

try{

window.location="google://search?q=Stüdyo%20Cemil";

}catch(e){}

setTimeout(function(){

window.location.href=reviewUrl;

},900);

return;

}

window.location.href=reviewUrl;

}

</script>

</body>
</html>
