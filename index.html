<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stüdyo Cemil</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:360px;
    background:#1d1d1d;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,215,0,.15);
}

h1{
    color:#FFD700;
    margin-bottom:10px;
    font-size:34px;
}

.stars{
    color:#FFD700;
    font-size:34px;
    margin:20px 0;
}

p{
    color:#ddd;
    line-height:1.6;
    margin-bottom:25px;
}

button{
    width:100%;
    border:none;
    background:#FFD700;
    color:#000;
    font-size:18px;
    font-weight:bold;
    padding:16px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}
</style>

</head>

<body>

<div class="card">

<h1>📸 Stüdyo Cemil</h1>

<div class="stars">
★★★★★
</div>

<p>
Değerli yorumunuz bizim için çok önemlidir.<br>
Google'da bizi değerlendirmeniz bizi mutlu eder.
</p>

<button onclick="openGoogleReview()">
Google'da Yorum Yap
</button>

</div>

<script>

function openGoogleReview(){

    // Önce Google uygulamasını açmayı dene
    window.location.href="google://search?q=St%C3%BCdyo%20Cemil";

    // Açılmazsa web yorum sayfasına git
    setTimeout(function(){

        window.location.href="https://search.google.com/local/writereview?placeid=ChIJG_OOIJ6wyhQRw3v4i_2wWaU";

    },1200);

}

</script>

</body>
</html>
